services:
  realty-crew:
    build: .
    container_name: realty-crew
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "4477"
      PUBLIC_ORIGIN: https://realtytorealty.com
    volumes:
      - ./agents:/app/agents
      - ./skills:/app/skills
      - ./memory:/app/memory
      - ./library:/app/library
      - ./data:/app/data
      - claude-home:/claude
    # The droplet has 2 GB for ~20 sites. Each working agent is a Claude Code process (250-400 MB);
    # 2 at a time plus the server peaks around 1 GB. Past 1.2 GB the crew swaps (slower) instead of
    # taking memory from the other sites; past 2 GB total it's stopped and restarted.
    mem_limit: 1200m
    memswap_limit: 2g
    networks:
      - caddy-proxy

volumes:
  claude-home:

networks:
  caddy-proxy:
    external: true
